name: Build Signed Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release_key -storepass 123456 -keypass 123456 -dname "CN=Android, O=Android, C=US"

    - name: Build Signed AAB and APK
      run: |
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
          -Pandroid.injected.signing.store.password=123456 \
          -Pandroid.injected.signing.key.alias=release_key \
          -Pandroid.injected.signing.key.password=123456
        
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
          -Pandroid.injected.signing.store.password=123456 \
          -Pandroid.injected.signing.key.alias=release_key \
          -Pandroid.injected.signing.key.password=123456

    - name: Upload Signed Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: signed-app-files-${{ github.run_number }}
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab
          
